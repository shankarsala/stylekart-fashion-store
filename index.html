<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleKart | Fashion Store</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="css/navbar.css">

    <!-- Google Material Symbols for navbar icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>

<body>

    <!-- ========== NAVBAR START ========== -->
    <header class="navbar">

        <!-- Logo -->
        <div class="logo_container">
            <a href="index.html">
                <img class="brand_logo" src="assets/images/logo.png" alt="StyleKart Logo">
            </a>
        </div>

        <!-- Navigation links -->
        <nav class="nav_bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home</a>
            <a href="#">Beauty</a>
            <a href="#">Gen Z</a>
            <a href="#">Studio <sup>New</sup></a>
        </nav>

        <!-- Search bar -->
        <div class="search_bar">
            <span class="material-symbols-outlined search_icon">
                search
            </span>

            <input class="search_input" type="search" placeholder="Search for products, brands and more"
                aria-label="Search products">
        </div>

        <!-- User actions -->
        <div class="action_bar">

            <!-- Profile -->
            <a href="#" class="action_container">
                <span class="material-symbols-outlined action_icon">
                    person
                </span>
                <span class="action_name">Profile</span>
            </a>

            <!-- Wishlist -->
            <a href="#" class="action_container">
                <span class="material-symbols-outlined action_icon">
                    favorite
                </span>
                <span class="action_name">Wishlist</span>
            </a>

            <!-- Shopping bag -->
            <a href="#" class="action_container">
                <span class="material-symbols-outlined action_icon">
                    shopping_bag
                </span>
                <span class="action_name">Bag</span>
            </a>

        </div>

    </header>
    <!-- ========== NAVBAR END ========== -->

    <!-- Main content -->
    <main>

        <!-- Promotional banner -->
        <div class="banner_container">
            Banner
        </div>

        <!-- Category heading -->
        <div class="category_heading">
            Shop By Category
        </div>

        <!-- Categories -->
        <div class="category_items">
            Categories
        </div>

    </main>

    <!-- Footer -->
    <footer>
        Footer
    </footer>

</body>

</html>
